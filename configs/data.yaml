# Ultralytics YOLO dataset configuration for NEU-DET
path: data/processed/NEU-DET
train: images/train
val: images/val
test: images/test

# Number of classes
nc: 6

# Class names (strictly ordered 0 to 5)
names:
  0: crazing
  1: inclusion
  2: patches
  3: pitted_surface
  4: rolled-in_scale
  5: scratches
